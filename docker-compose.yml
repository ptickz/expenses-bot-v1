services:
  postgres:
    container_name: expenses_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-expenses}
      POSTGRES_USER: ${DB_USER:-expenses}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:-Asia/Tbilisi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_FORWARD_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    container_name: expenses_app
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-expenses}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-expenses}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
